apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
  annotations:
    deployment.british-museum-agent/scaling-guard: sqlite-and-chroma-are-single-writer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: mcp-server
              topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: british-museum-agent-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - python scripts/ingest.py && python scripts/ingest_chroma.py && exec uvicorn british_museum_agent.api.main:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: british-museum-config
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: british-museum-secrets
                  key: GOOGLE_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: british-museum-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: british-museum-secrets
                  key: LANGSMITH_API_KEY
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: british-museum-secrets
                  key: JWT_SECRET
            - name: MCP_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: british-museum-secrets
                  key: MCP_INTERNAL_TOKEN
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: chroma-data
              mountPath: /app/data/chroma
            - name: sqlite-data
              mountPath: /app/data/sqlite
            - name: huggingface-cache
              mountPath: /app/.cache/huggingface
            - name: processed-data
              mountPath: /app/data/processed
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: chroma-data
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-data
        - name: huggingface-cache
          persistentVolumeClaim:
            claimName: huggingface-cache
        - name: processed-data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
