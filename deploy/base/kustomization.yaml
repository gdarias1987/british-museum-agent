apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: british-museum-agent

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - backend.yaml
  - ui.yaml
  - mcp-server.yaml
  - phoenix.yaml
  - hpa.yaml
  - network-policies.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: british-museum-agent
    includeSelectors: true
    includeTemplates: true
