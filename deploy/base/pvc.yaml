apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data
  annotations:
    deployment.british-museum-agent/storage-role: single-writer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
