apiVersion: v1
kind: ConfigMap
metadata:
  name: british-museum-config
data:
  APP_ENV: kubernetes
  APP_NAME: British Museum Agent
  DATA_DIR: /app/data
  RAW_SPANISH_PATH: /app/data/raw/spanish
  INDEX_PATH: /app/data/processed/knowledge_index.json
  SQLITE_PATH: /app/data/sqlite/app.db
  CHROMA_PATH: /app/data/chroma
  CHROMA_COLLECTION_NAME: british_museum_es
  RETRIEVAL_BACKEND: chroma
  EMBEDDING_MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  RERANKER_MODEL_NAME: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  RETRIEVAL_CANDIDATE_K: "10"
  LLM_PROVIDER: gemini
  GEMINI_MODEL: gemini-2.5-flash
  LANGSMITH_TRACING: "false"
  LANGSMITH_PROJECT: british-museum-agent
  STAFF_DEMO_USERNAME: staff@example.com
  JWT_EXPIRATION_MINUTES: "60"
  MCP_SERVER_URL: http://mcp-server:8001/mcp
  MCP_TRANSPORT: streamable-http
  MCP_HOST: 0.0.0.0
  MCP_PORT: "8001"
  MCP_PATH: /mcp
  STREAMLIT_BACKEND_URL: http://backend:8000
  HF_HOME: /app/.cache/huggingface
  PHOENIX_ENDPOINT: http://phoenix:6006
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
